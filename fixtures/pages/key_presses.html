<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>The Internet</title></head>
<body>
<div id="flash-messages"></div>
<div id="content">
<div class='example'>
  <h3>Key Presses</h3>
  <p>Key presses are often used to interact with a website (e.g., tab order, enter, escape, etc.). Press a key and see what you inputted.</p>
  <form><input id='target' type='text'></form>
  <p id='result' style='color:green'></p>
</div>
<script>
document.addEventListener('keydown', function (event) {
  var out = event.key === ' ' ? 'SPACE' : event.key.toUpperCase();
  document.getElementById('result').textContent = 'You entered: ' + out;
});
</script>
</div>
<div id="page-footer"><hr><div>Powered by <a href="http://elementalselenium.com/">Elemental Selenium</a></div></div>
</body>
</html>
