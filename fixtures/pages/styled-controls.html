<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture styled controls</title><style>.sr{position:absolute;opacity:0;width:1px;height:1px}.box{display:inline-block;width:16px;height:16px;border:1px solid #333}label.styled{display:inline-flex;gap:6px;padding:4px}</style></head><body><h1>Preferences</h1><label class="styled" id="l-news"><input class="sr" type="checkbox" id="news"><span class="box"></span>Send me the newsletter</label><label class="styled" id="l-basic"><input class="sr" type="radio" name="plan" id="basic" value="basic"><span class="box"></span>Basic plan</label><label class="styled" id="l-pro"><input class="sr" type="radio" name="plan" id="pro" value="pro"><span class="box"></span>Pro plan</label><input type="checkbox" id="terms"><label for="terms">I agree to the terms</label></body></html>
