<!doctype html>
<!-- r21 verifier F3: an SVG element's className is an SVGAnimatedString
     object that stringifies to '[object SVGAnimatedString]', so the pre-fix
     id/class arm never matched a captcha class carried by an SVG. The arm
     reads the class ATTRIBUTE instead (works for HTML and SVG). This page's
     ONLY captcha matcher is a VISIBLE 130x130 (16900 px^2 >= 16000) svg with
     class="captcha-widget" — signals.captcha must be TRUE post-fix and was
     FALSE pre-fix (the fail-first tooth). -->
<html lang="en">
<head><meta charset="utf-8"><title>Captcha SVG Visible</title></head>
<body>
  <h1>Normal page</h1>
  <svg id="widget" class="captcha-widget" width="130" height="130" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="130" height="130" fill="#dddddd"></rect>
  </svg>
  <button id="plain" type="button">Plain button</button>
</body>
</html>
