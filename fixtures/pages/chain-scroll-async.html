<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture chain scroll async</title></head><body><h1>Chain scroll async</h1><div id="list"></div><script>var n=0;function add(){for(var i=0;i<2;i++){if(n>=6)break;n++;var d=document.createElement('div');d.className='item';d.textContent='Item '+n;document.getElementById('list').appendChild(d);}}add();var armed=false;window.addEventListener('wheel',function(){if(armed)return;armed=true;setTimeout(add,600);});</script></body></html>
