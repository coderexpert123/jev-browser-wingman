<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture ops</title><style>#menu{display:none}#hoverzone:hover #menu{display:block}.tall{height:3000px}</style></head><body><h1>Ops</h1><div id="hoverzone"><button type="button" id="hoverbtn" onmouseenter="document.getElementById('log').textContent='hovered'">Hover me</button><div id="menu"><a href="#m">Menu item</a></div></div><button type="button" id="dbl" ondblclick="document.getElementById('log').textContent='double'">Double me</button><label for="first">First</label><input id="first" type="text"><label for="second">Second</label><input id="second" type="text"><div id="editor" contenteditable="true" aria-label="Editor">old text</div><label for="doc">Document</label><input id="doc" type="file" onchange="document.getElementById('log').textContent='file:'+this.files[0].name"><output id="log"></output><div class="tall"></div><button type="button" id="far" onclick="document.getElementById('log').textContent='far'">Far away</button></body></html>
