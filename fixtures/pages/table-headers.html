<!doctype html><html><head><title>Table headers</title></head><body>
<table id="table1">
  <thead><tr><th>Last Name</th><th>First Name</th></tr></thead>
  <tbody><tr><td>Smith</td><td>John</td></tr></tbody>
</table>
<table id="table2">
  <thead><tr><th>Last Name</th><th>First Name</th></tr></thead>
  <tbody>
    <tr><td>Doe</td><td>Jane</td></tr>
    <tr><td colspan="2"><button id="table2-button">Sort rows</button></td></tr>
  </tbody>
</table>
<div id="outside-control" role="button">Outside control</div>
</body></html>
