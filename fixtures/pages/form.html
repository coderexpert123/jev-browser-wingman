<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture form</title></head><body><h1>Order details</h1><form id="details" action="/save" method="post" onsubmit="event.preventDefault(); document.getElementById('log').textContent='submitted';"><label for="fullname">Full name</label><input id="fullname" name="fullname" type="text"><input id="email" name="email" type="email" aria-label="Email"><textarea id="notes" name="notes" placeholder="Notes">prefilled note text</textarea><label for="country">Country</label><select id="country" name="country"><option value="">Choose</option><option value="in">India</option><option value="us">United States</option></select><button type="button" id="continue" onclick="document.getElementById('log').textContent='continued';">Continue</button><button type="submit" id="place">Place order</button></form><output id="log"></output></body></html>
